Name: Chemie Lernen
Summary: Interactive chemistry learning platform (WebView)
Description: |-
    Chemie Lernen — Android App (Free Edition / F-Droid)

    Inoffizielle Android-App für chemie-lernen.org — die kostenlose
    interaktive Lernplattform für Chemie.

    Features:
    • 12 Themenbereiche der Chemie (Einführung bis Biochemie)
    • 10+ Rechner (Molare Masse, pH, Stöchiometrie, Gasgesetze…)
    • 15 Lernvideos
    • Native Android UI (Jetpack Compose, Material 3)
    • Offline-fähig (WebView-Cache)
    • Kein Tracking, keine Werbung, keine Google Play Services

RequiresRoot: 'no'

